<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rowspan and colspan</title>
</head>
<body>
    <table border="1">
        <tr>
            <th colspan="2">Student Details</th>
        </tr>
        <tr>
            <td>Name</td>
            <td>Rahul</td>
        </tr>
        <tr>
            <td rowspan="2">Marks</td>
            <td>Math: 90</td>
        </tr>
        <tr>
            <td>English: 85</td>
        </tr>
    </table>

</body>
</html>
